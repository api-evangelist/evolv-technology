name: Evolv Technology
description: >-
  Evolv Technologies Holdings, Inc. (NASDAQ: EVLV), headquartered in Waltham,
  Massachusetts, builds AI-based touchless security screening systems used to
  detect concealed weapons at venues, schools, hospitals, workplaces, and
  stadiums. Its flagship Evolv Express walk-through system uses sensor fusion
  and machine learning to screen people at high throughput without requiring
  them to stop, empty pockets, or remove bags, and the companion Evolv Insights
  analytics product reports on screening volume, alert rates, and operational
  performance. Evolv Technology is a portfolio company of DCVC and was added to
  the API Evangelist network as a company profile. As of this enrichment pass
  the company publishes no public developer API, OpenAPI/Swagger definition,
  SDK, MCP server, or open developer portal; its public web presence is served
  behind bot protection and its status surface is gated behind SSO.
